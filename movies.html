  <script>

      window.movies = {
        "Trending Actions": [
          { title: "John Wick: Chapter 4", image: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=600&auto=format&fit=crop", category: "Action" },

          { title: "Interstellar", image: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=600&auto=format&fit=crop", category: "VOD" },
          { title: "Blade Runner 2048", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop", category: "Ultra HD" }
        ]

  <!-- Optional Script Node to read public file safely if path is mapped natively -->
  <!-- Client-Side Runtime Execution Logic Engine -->
  <script>
    let currentCategory = "";
    let currentPage = 1;
    const itemsPerPage = 12;

    function initCatalog() {
      const loadingSpinner = document.getElementById('loading_spinner');
      if (loadingSpinner) loadingSpinner.remove();
      
      document.getElementById('main_catalog_grid').classList.remove('d-none');

      const categories = Object.keys(movies);
      document.getElementById('categoryCountBadge').innerText = `${categories.length} GROUPS`;

      if(categories.length === 0) return;
      currentCategory = categories[0];

      renderCategorySidebar(categories);

      document.getElementById('categorySearch').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase().trim();
        const filteredCategories = categories.filter(cat => cat.toLowerCase().includes(searchTerm));
        renderCategorySidebar(filteredCategories, true);
      });

      renderActivePage();
    }

    function renderCategorySidebar(categoryList, isFiltering = false) {
      const sidebar = document.getElementById('headerButtons');
      sidebar.innerHTML = '';

      if(categoryList.length === 0) {
        sidebar.innerHTML = `<div style="color:#475569; padding:20px; font-size:13px; text-align:center; font-weight:500;">No matching branches located.</div>`;
        return;
      }

      categoryList.forEach((category) => {
        const totalVods = movies[category] ? movies[category].length : 0;
        const btn = document.createElement('button');
        
        const isSelected = category === currentCategory;
        btn.className = `category-btn ${isSelected ? 'active' : ''}`;
        
        btn.innerHTML = `
          <div class="cat-label-info">
            <i class="fas fa-compact-disc" style="font-size: 13px; opacity: 0.7;"></i>
            <span>${category}</span>
          </div>
          <span class="cat-badge-counter">${totalVods}</span>
        `;
        
        btn.addEventListener('click', () => {
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = category;
          currentPage = 1;
          renderActivePage();
          
          if (window.innerWidth < 992) {
            document.getElementById('movieGridContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        });

        sidebar.appendChild(btn);
      });

      if(isFiltering && !categoryList.includes(currentCategory)) {
        currentCategory = categoryList[0];
        currentPage = 1;
        renderActivePage();
      }
    }

    function renderActivePage() {
      const gridContainer = document.getElementById('movieGridContainer');
      gridContainer.innerHTML = '';

      const activeSet = movies[currentCategory] || [];
      const totalItems = activeSet.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
      const runningSlice = activeSet.slice(startIndex, endIndex);

      if(runningSlice.length === 0) {
        gridContainer.innerHTML = `<div class="col-12" style="color:#475569; padding:40px 0; text-align:center; font-weight: 500;">No media records captured inside target container nodes.</div>`;
      } else {
        runningSlice.forEach(item => {
          const cardCol = document.createElement('div');
          cardCol.className = "col";
          
          cardCol.innerHTML = `
            <div class="movie-theater-card">
              <div class="movie-poster-wrapper">
                <img src="${item.image}" class="movie-poster-img" onerror="this.src='https://images.unsplash.com/photo-1440404653325-ab127d49abc1?q=80&w=600&auto=format&fit=crop';">
                
              </div>
              <div class="movie-details-pane">
                <div class="movie-title-text" title="${item.title}">${item.title}</div>
                <div class="d-flex justify-content-between align-items-center mt-1">
                  <span class="movie-tag-badge">${item.category ? item.category.trim() : 'VOD'}</span>
                  <span style="font-size: 11px; color: #475569; font-weight: 600;"><i class="fas fa-star text-warning me-1"></i>4.9</span>
                </div>
              </div>
            </div>
          `;
          gridContainer.appendChild(cardCol);
        });
      }

      document.getElementById('paginationInfo').innerText = totalItems > 0 
        ? `Viewing ${startIndex + 1} – ${endIndex} of ${totalItems} tracks` 
        : 'Empty criteria index parameters mapping nodes arrays.';

      buildPaginationControls(totalPages);
    }

    function buildPaginationControls(totalPages) {
      const controlsContainer = document.getElementById('paginationControls');
      controlsContainer.innerHTML = '';

      if (totalPages <= 1) return;

      const prevBtn = document.createElement('div');
      prevBtn.className = `page-link-custom ${currentPage === 1 ? 'disabled' : ''}`;
      prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
      if (currentPage > 1) {
        prevBtn.addEventListener('click', () => { currentPage--; renderActivePage(); });
      }
      controlsContainer.appendChild(prevBtn);

      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + 4);
      if (endPage - startPage < 4) {
        startPage = Math.max(1, endPage - 4);
      }

      for (let i = startPage; i <= endPage; i++) {
        const pageBtn = document.createElement('div');
        pageBtn.className = `page-link-custom ${currentPage === i ? 'active' : ''}`;
        pageBtn.innerText = i;
        pageBtn.addEventListener('click', () => { currentPage = i; renderActivePage(); });
        controlsContainer.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('div');
      nextBtn.className = `page-link-custom ${currentPage === totalPages ? 'disabled' : ''}`;
      nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
      if (currentPage < totalPages) {
        nextBtn.addEventListener('click', () => { currentPage++; renderActivePage(); });
      }
      controlsContainer.appendChild(nextBtn);
    }

    document.addEventListener("DOMContentLoaded", function() {
      initCatalog();
    });
  </script>
