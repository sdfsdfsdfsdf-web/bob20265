<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &middot; Bobres IPTV</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #08090c; color: #f8fafc; text-align: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 560px; }
  .code {
    font-size: clamp(84px, 22vw, 160px); font-weight: 800; line-height: 1; letter-spacing: -0.04em;
    background: linear-gradient(180deg, #ffffff 0%, #f43f5e 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1 { font-size: 24px; margin: 8px 0 12px; }
  p { color: #94a3b8; line-height: 1.7; margin: 0 0 28px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    text-decoration: none; padding: 13px 28px; border-radius: 999px; font-weight: 600; font-size: 15px;
    transition: transform .2s ease, background .2s ease;
  }
  a.primary { background: #e91e63; color: #fff; }
  a.secondary { background: transparent; color: #fff; border: 1px solid #3f3f46; }
  a:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn&rsquo;t exist</h1>
    <p>It may have been moved, renamed, or is temporarily unavailable.</p>
    <div class="actions">
      <a class="primary" data-root-link href="/">Back to homepage</a>
      <a class="secondary" data-root-link href="/contact.html">Contact us</a>
    </div>
  </div>
<script>
  // GitHub Pages serves this file for any missing URL, so relative links would
  // resolve against the missing path. Find the deployment root (works at
  // username.github.io/repo-name/) and point the buttons at it.
  (function () {
    var segs = location.pathname.split('/').filter(Boolean);
    var links = document.querySelectorAll('[data-root-link]');
    if (!links.length) return;

    function setRoot(root) {
      for (var i = 0; i < links.length; i++) {
        var target = links[i].getAttribute('href').replace(/^\/+/, '');
        links[i].setAttribute('href', root + target);
      }
    }
    setRoot('/');

    (function probe(i) {
      if (i < 1) return;
      var root = '/' + segs.slice(0, i).join('/') + '/';
      fetch(root + 'index.html', { method: 'HEAD' })
        .then(function (r) { if (r.ok) setRoot(root); else probe(i - 1); })
        .catch(function () { probe(i - 1); });
    })(segs.length);
  })();
</script>
</body>
</html>
